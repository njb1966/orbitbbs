[sdl]
fullscreen=false
fulldouble=false
fullresolution=original
windowresolution=1024x768
output=surface
autolock=false
sensitivity=100
waitonerror=true
priority=higher,normal
mapperfile=mapper-build.map
usescancodes=true

[dosbox]
language=
machine=svga_s3
captures=capture
memsize=64

[render]
frameskip=0
aspect=false
scaler=normal3x

[cpu]
core=auto
cputype=auto
cycles=max
cycleup=10
cycledown=20

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[autoexec]
# Mount project root as C:
mount c /home/nick/Projects/Code_Projects/orbitbbs
c:
set PATH=C:\BCPP31\BIN
set TEMP=C:\TEMP
mkdir TEMP
cd wwivs424
echo.
echo OrbitBBS Build Environment Ready
echo Borland C++ 3.1 in PATH
echo Source dir: C:\wwivs424
echo.
echo To build: make -f makefile.mak
echo To build single file: bcc -ml -c filename.c
echo.
